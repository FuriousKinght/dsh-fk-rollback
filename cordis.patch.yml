# dsh-fk-rollback bundle patch layer
#
# 这个文件只注册一行 loader。本插件的 Host 半边没有副作用，
# 不覆盖任何官方配置行（web / permission / ui-chat 等一律不碰）。
#
# ⚠️ 硬约束（来自 DSH 插件开发手册）：
#   name: 必须【完全等于】package.json 的 name。
#   因为 client-modules 的 node 半边用
#     require.resolve('<row-name>/package.json')
#   去定位包，name 写错就加载失败。
#
# id 可以与 name 不同 —— 它只是行标识，惯例用短名。
- insert:
    - id: fk-rollback
      name: 'dsh-fk-rollback'
